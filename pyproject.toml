[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spinaiocr"
version = "0.0.1"
description = "The fastest, smallest Korean OCR — ~80 MB, ~14 ms/line on CPU, fully offline. No GPU, no cloud."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SPINAI OCR Team" }]
keywords = ["ocr", "korean", "hangul", "korean-ocr", "text-detection", "text-recognition",
            "cpu", "offline", "on-device", "lightweight", "deep-learning"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python>=4.9",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "click>=8.1",
    "tqdm>=4.66",
    "rich>=13.7",
    "einops>=0.7",
    "shapely>=2.0",
    "pyclipper>=1.3",
    "rapidfuzz>=3.6",
    "jiwer>=3.0",
]

[project.optional-dependencies]
train = [
    "lightning>=2.2",
    "torchmetrics>=1.3",
    "wandb>=0.16",
    "accelerate>=0.27",
    "datasets>=2.18",
    "transformers>=4.40",
    "albumentations>=1.4",
]
data = [
    "kaggle>=1.6",
    "huggingface-hub>=0.22",
    "datasets>=2.18",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.9",
]
synth = [
    "trdg>=1.8",
    "fonttools>=4.50",
    "freetype-py>=2.4",
]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "onnxruntime>=1.17",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.6",
]

[project.scripts]
spinaiocr = "spinaiocr.cli:main"
spinaiocr-collect = "spinaiocr.data.collect:main"
spinaiocr-bench = "spinaiocr.benchmark.run:main"
spinaiocr-logs = "spinaiocr.log.cli:main"

[project.urls]
Homepage = "https://github.com/SpinAIceo/spinai-ocr"
Documentation = "https://github.com/SpinAIceo/spinai-ocr/blob/main/README.md"
Issues = "https://github.com/SpinAIceo/spinai-ocr/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
